<style>
:root{--ink:#0a0a0b;--ink2:#131316;--ink3:#1c1c20;--ink4:#27272d;--fg:#f4f1ea;--mut:#9a9aa5;--faint:#6a6a74;--line:#2a2a30;--fw:#5b8cff;--warn:#f5a524;--good:#34d399;--on:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="light"]{--ink:#f2f2ee;--ink2:#fff;--ink3:#ebebe5;--ink4:#deded6;--fg:#17171a;--mut:#62626c;--faint:#8c8c96;--line:#d9d9d1;color-scheme:light}

body{background:var(--ink);color:var(--fg);font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif;min-height:100%;transition:background .4s,color .4s}

.shell{display:flex;min-height:100dvh}
aside{display:none;width:250px;flex:none}aside>div{position:sticky;top:0;height:100dvh;padding:12px}
.side{height:100%;background:var(--ink2);border-radius:28px;padding:14px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:10px 6px 0}

main{flex:1;min-width:0;max-width:680px;margin:0 auto;padding-bottom:110px}

.bro{background:var(--ink2);border-radius:28px;min-height:21rem;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:30px 0 20px;cursor:pointer;user-select:none;touch-action:manipulation}
.bro:fullscreen{border-radius:0;min-height:100dvh}
.tag{position:absolute;top:14px;left:14px;background:var(--ink4);border-radius:99px;padding:4px 10px;font:700 10px 'Plus Jakarta Sans';letter-spacing:.1em;color:var(--mut)}
.fs{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink4);font-size:16px}

.go{width:100%;height:50px;border:0;border-radius:18px;background:var(--fw);color:var(--on);font-size:16px;font-weight:700}
.bro .go{width:auto;padding:0 28px;margin-top:16px;height:44px;border-radius:99px}
.go.stop{background:var(--warn);color:#1a1200}
.sel{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;transition:opacity .3s}.sel.lock{opacity:.45;pointer-events:none}
.chip{flex:none;border:0;background:var(--ink3);border-radius:99px;padding:8px 15px;font-size:14px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--fw);color:var(--on)}
.task,.top{display:flex;align-items:center;gap:11px;background:var(--ink3);border-radius:16px;padding:10px 12px;margin-bottom:6px;font-size:15px;transition:background .25s}
.task input,.top input{width:20px;height:20px;accent-color:var(--fw);flex:none}
.task label,.top label{flex:1;transition:color .25s}.task.d{background:color-mix(in srgb,var(--good) 10%,var(--ink3))}.task.d label{text-decoration:line-through;color:var(--faint)}
.x{border:0;background:none;color:var(--faint);font-size:20px;padding:0 4px}
.add{display:flex;gap:8px;margin-top:6px}
.add input,textarea{flex:1;min-width:0;background:var(--ink3);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;transition:border-color .2s}
.add input:focus,textarea:focus{border-color:var(--fw);outline:0}
.add button{border:0;background:var(--ink4);border-radius:14px;padding:0 18px;font-weight:600}
.empty{color:var(--faint);font-size:14px;padding:4px 6px 8px}
.wall{display:flex;flex-wrap:wrap;gap:8px}
.w{background:var(--ink3);border-radius:16px;padding:10px 14px;font-size:14.5px;font-weight:500}
.w:nth-child(3n+1){background:color-mix(in srgb,var(--fw) 18%,var(--ink3))}.w:nth-child(3n+2){background:color-mix(in srgb,var(--good) 16%,var(--ink3))}
.w button{border:0;background:none;color:var(--faint);margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font:700 32px 'Plus Jakarta Sans';font-variant-numeric:tabular-nums}.big small{font-size:14px;color:var(--mut);margin:0 6px 0 2px}
.cap{font-size:13px;color:var(--mut)}
.goal{display:flex;align-items:center;gap:16px}
.ring{width:108px;height:108px;flex:none;transform:rotate(-90deg)}.rb,.rf{fill:none;stroke-width:9}.rb{stroke:var(--ink3)}
.rf{stroke:var(--fw);stroke-linecap:round;stroke-dasharray:264;transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.gi{flex:1;min-width:0}.mini{border:0;background:var(--ink3);width:28px;height:28px;border-radius:50%;font-size:16px;margin:0 2px}
.lv{margin-top:10px}.lv .pb{margin:5px 0 0}
.days{display:flex;justify-content:space-between;margin-top:10px}
.dd{text-align:center;font-size:12px;color:var(--faint)}.dd i{display:block;width:30px;height:30px;border-radius:50%;background:var(--ink3);margin:0 auto 5px;transition:background .3s}
.dd.y i{background:var(--good)}.dd.t i{outline:2px solid var(--fw);outline-offset:2px}
.top .n{width:24px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--faint)}
.bars i{display:block;background:var(--fw);border-radius:6px 6px 3px 3px;min-height:3px;margin-bottom:5px;transform-origin:bottom;animation:gr .7s cubic-bezier(.22,1,.36,1)}
@keyframes gr{from{transform:scaleY(0)}}
.pb{height:7px;background:var(--ink3);border-radius:9px;overflow:hidden;margin:8px 0 10px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--fw),#22d3ee);border-radius:9px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.sh{display:flex;justify-content:space-between;font-size:16px;font-weight:600}.sh span{font-size:13px;color:var(--mut);font-weight:400}
.tabs{display:flex;gap:8px}
.bt{width:100%;height:46px;border:0;border-radius:16px;background:var(--ink3);font-weight:600;font-size:15px;margin-top:8px}.bt.r{color:var(--warn)}
textarea{width:100%;height:80px;margin-top:8px;display:block;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--ink);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.22,1,.36,1);z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:50}
:focus-visible{outline:2px solid var(--fw);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

 sad:{c:'var(--warn)',w:40,h:49,r:'36%',l:'polygon(0 43%,100% 20%,100% 100%,0 100%)',q:'polygon(0 20%,100% 43%,100% 100%,0 100%)',t:'ATTENTION',m:['আজ এখনো কিছু পড়া হয়নি…','একটা সেশন শুরু করলেই মন ভালো হয়ে যাবে','আমি অপেক্ষায় আছি, ভাই']},

 focus:{c:'var(--fw)',w:42,h:62,r:'40%',l:'none',q:'none',t:'FOCUS',m:['ফোকাস চলছে… ফোন দূরে রাখো','একটাই কাজ, পুরো মন দিয়ে']},

 proud:{c:'var(--good)',w:46,h:58,r:'50%',l:'none',q:'none',t:'LEGEND',m:['লক্ষ্য পূরণ! BUET আরও কাছে ⚡','আজ তুমি অসাধারণ']}};

function def(){return{cur:0,mode:0,goal:14400,run:null,log:{},sl:{},tasks:{},eod:{},pd:0,edit:0,theme:'dark',gd:'',
 wall:['BUET CSE ⚡','টনি স্টার্ক হওয়ার পথে','রোজ একটু একটু করে'],
 subs:[{n:'Physics',t:[['Vector',0],['Newtonian Mechanics',0],['Thermodynamics',0],['Waves',0]]},
 {n:'Chemistry',t:[['Atomic Structure',0],['Periodic Table',0],['Chemical Bonding',0]]},
 {n:'Higher Math',t:[['Matrices',0],['Functions & Graphs',0],['Differentiation',0]]},
 {n:'English',t:[['Grammar',0],['Vocabulary',0]]}]}}
var S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){try{var o=JSON.parse(localStorage.getItem(OLD));if(o&&o.subs){S=o;S.mode=0;S.goal=14400;S.gd='';S.run=o.run?{t:o.run,tg:0,s:(o.subs[o.cur]||{}).n||''}:null}}catch(e){}}
if(!S||!S.subs)S=def();

function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function p2(n){return n<10?'0'+n:''+n}
function KD(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function K(o){var d=new Date();d.setDate(d.getDate()+(o||0));return KD(d)}
function mid(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function hh(s){return (s/3600).toFixed(1)}

function fmt(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':':'')+p2(m)+':'+p2(s%60)}
function pr(s){return s.split(',').map(Number)}
function setT(id,t){var e=$(id);if(e&&e.textContent!==t)e.textContent=t}
function setH(id,h){var e=$(id);if(e&&e.dataset.v!==h){e.dataset.v=h;e.innerHTML=h}}

function today(){var r=S.run?Math.min(36000,Math.max(0,Math.floor((Date.now()-Math.max(S.run.t,mid()))/1000))):0;return (S.log[K()]||0)+r}
function streak(){var n=0,o=S.log[K()]||S.run?0:-1;while(S.log[K(o)]){n++;o--}return n}
function total(){return Object.keys(S.log).reduce(function(a,k){return a+S.log[k]},0)}

function setTheme(){document.documentElement.dataset.theme=S.theme;document.querySelector('meta[name=theme-color]').content=S.theme==='light'?'#f2f2ee':'#0a0a0b'}
setTheme();
var page=(location.hash||'#bro').slice(1);if(!PG.some(function(p){return p[0]===page}))page='bro';
var UI={pu:0,last:'',wl:null,tt:0};

/* feedback */

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function burst(el){if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,C=['#5b8cff','#34d399','#f5a524','#f472b6','#22d3ee'];
 for(var i=0;i<16;i++){var p=document.createElement('i');p.className='cf';p.style.cssText='left:'+x+'px;top:'+y+'px;background:'+C[i%5];document.body.appendChild(p);var a=Math.random()*6.28,d=50+Math.random()*70;
 p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+30)+'px) scale(.3)',opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=(function(q){return function(){q.remove()}})(p)}}

/* builders */

 return (L.length?L.map(function(t,i){return '<div class="task'+(t[1]?' d':'')+'"><input type="checkbox" id="k'+o+'_'+i+'" data-ck="'+o+','+i+'"'+(t[1]?' checked':'')+'><label for="k'+o+'_'+i+'">'+esc(t[0])+'</label><button class="x" aria-label="মুছে ফেলো" data-dl="'+o+','+i+'">×</button></div>'}).join(''):'<p class="empty">'+WF[new Date(Date.now()+o*864e5).getDay()]+'-এ কিছু বসানো নেই। নিচে লিখে যোগ করো।</p>')

run:function(){return '<section class="card"><h2>কী পড়বে</h2><div class="sel'+(S.run?' lock':'')+'">'+S.subs.map(function(s,i){return '<button class="chip'+(i===S.cur?' on':'')+'" data-su="'+i+'">'+esc(s.n)+'</button>'}).join('')+'</div><div class="sel'+(S.run?' lock':'')+'">'+MODES.map(function(m,i){return '<button class="chip'+(i===S.mode?' on':'')+'" data-mo="'+i+'">'+m[0]+'</button>'}).join('')+'</div><button class="go" id="rgo" data-a="run" style="margin-top:6px"></button></section>'},
goal:function(){var t=today(),L=lvl(),g=hm(S.goal);
 return '<section class="card"><div class="goal"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="rb" cx="50" cy="50" r="42"/><circle class="rf" id="ring" cx="50" cy="50" r="42" style="stroke-dashoffset:'+Math.round(264*(1-Math.min(1,t/S.goal)))+'"/></svg><div class="gi"><p class="cap">আজ পড়েছ</p><p class="big" id="big"></p><p class="cap">লক্ষ্য <b>'+g[0]+'h'+(g[1]?' '+g[1]+'m':'')+'</b> <button class="mini" data-a="g-" aria-label="লক্ষ্য কমাও">−</button><button class="mini" data-a="g+" aria-label="লক্ষ্য বাড়াও">+</button></p></div></div>'
 +'<div class="two" style="margin-top:12px"><div><p class="cap">টানা</p><p class="big">'+streak()+'<small>দিন</small></p></div><div class="lv"><p class="cap">লেভেল '+(L.L+1)+' · '+LV[L.L]+'</p><div class="pb"><i style="width:'+L.p+'%"></i></div></div></div></section>'},
tasks:function(){return '<section class="card"><h2>আজকের টাস্ক লিস্ট<span class="cap" id="tc">'+tcount(0)+'</span></h2>'+tasksH(0)+'</section>'},
wall:function(){return '<section class="card"><h2>আমার ওয়াল<button data-a="edit">'+(S.edit?'হয়েছে':'সাজাও')+'</button></h2><div class="wall">'+S.wall.map(function(w,i){return '<span class="w">'+esc(w)+(S.edit?'<button data-dw="'+i+'" aria-label="মুছো">×</button>':'')+'</span>'}).join('')+'</div>'+(S.edit?'<div class="add"><input data-in="w" placeholder="লক্ষ্য বা কথা লিখো"><button data-ad="w">যোগ</button></div>':'')+'</section>'},
week:function(){var d=[];for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);d.push('<div class="dd'+(S.log[K(-i)]?' y':'')+(i===0?' t':'')+'"><i></i>'+WD[x.getDay()]+'</div>')}return '<section class="card"><p class="cap">গত ৭ দিন</p><div class="days">'+d.join('')+'</div></section>'},
eod:function(){var n=S.eod[K()]||[0,0];return '<section class="card"><h2>দিন শেষের দুটো কাজ</h2><div class="top"><input type="checkbox" id="e0" data-eo="0"'+(n[0]?' checked':'')+'><label for="e0">আজ কী কী পড়লে, নোট করে রাখো</label></div><div class="top"><input type="checkbox" id="e1" data-eo="1"'+(n[1]?' checked':'')+'><label for="e1">কাল কী পড়বে, এখনই প্ল্যান করে ফেলো</label></div></section>'},
log:function(){return '<section class="card"><h2>ডেইলি লগ</h2><div class="two"><div><p class="cap">গতকাল</p><p class="big">'+hh(S.log[K(-1)]||0)+'<small>ঘণ্টা</small></p></div><div><p class="cap">আজ</p><p class="big" id="lg"></p></div></div></section>'},
courses:function(){return S.subs.map(function(s,i){var dn=s.t.filter(function(t){return t[1]}).length,p=s.t.length?Math.round(dn/s.t.length*100):0;
 return '<section class="card"><div class="sh">'+esc(s.n)+'<span id="pt'+i+'">'+dn+'/'+s.t.length+' · '+p+'%</span></div><div class="pb"><i id="pb'+i+'" style="width:'+p+'%"></i></div>'
 +s.t.map(function(t,j){return '<div class="task'+(t[1]?' d':'')+'"><input type="checkbox" id="c'+i+'_'+j+'" data-tp="'+i+','+j+'"'+(t[1]?' checked':'')+'><label for="c'+i+'_'+j+'">'+esc(t[0])+'</label><button class="x" aria-label="মুছো" data-dt="'+i+','+j+'">×</button></div>'}).join('')
 +'<div class="add"><input data-in="c'+i+'" placeholder="নতুন টপিক"><button data-ad="c'+i+'">যোগ</button></div></section>'}).join('')
 +'<section class="card"><div class="add" style="margin:0"><input data-in="ns" placeholder="নতুন সাবজেক্ট"><button data-ad="ns">যোগ</button></div></section>'},
plan:function(){var y=(S.tasks[K(-1)]||[]).filter(function(t){return !t[1]}).length;
 return '<section class="card"><div class="tabs">'+['আজ','কাল'].map(function(n,i){return '<button class="chip'+(S.pd===i?' on':'')+'" data-pd="'+i+'">'+n+'</button>'}).join('')+'</div><h2 style="padding-top:12px"><span class="cap" id="tc">'+tcount(S.pd)+'</span></h2>'+tasksH(S.pd)
 +(S.pd===0&&y?'<button class="bt" data-a="carry">গতকালের বাকি '+y+'টি টাস্ক আনো</button>':'')+'</section>'},
stats:function(){var mx=1800,b=[],i;for(i=13;i>=0;i--){var v=S.log[K(-i)]||0;mx=Math.max(mx,v);b.push([i,v])}
 var w=0,best=0;for(i=0;i<7;i++)w+=S.log[K(-i)]||0;Object.keys(S.log).forEach(function(k){best=Math.max(best,S.log[k])});
 var sm=Math.max.apply(null,S.subs.map(function(s){return S.sl[s.n]||0}).concat([1]));
 return '<section class="card two"><div><p class="cap">মোট পড়া</p><p class="big">'+hh(total())+'<small>ঘণ্টা</small></p></div><div><p class="cap">দিনে গড় (৭ দিন)</p><p class="big">'+hh(w/7)+'<small>ঘণ্টা</small></p></div><div><p class="cap">সেরা দিন</p><p class="big">'+hh(best)+'<small>ঘণ্টা</small></p></div><div><p class="cap">টানা</p><p class="big">'+streak()+'<small>দিন</small></p></div></section>'
 +'<section class="card"><h2>শেষ ১৪ দিন</h2><div class="bars">'+b.map(function(x){var d=new Date();d.setDate(d.getDate()-x[0]);return '<div><i style="height:'+Math.round(x[1]/mx*100)+'px" title="'+hh(x[1])+' ঘণ্টা"></i>'+d.getDate()+'</div>'}).join('')+'</div></section>'
 +'<section class="card"><h2>সাবজেক্ট অনুযায়ী</h2>'+S.subs.map(function(s){var v=S.sl[s.n]||0;return '<div class="sh" style="font-size:14px">'+esc(s.n)+'<span>'+hh(v)+' ঘণ্টা</span></div><div class="pb"><i style="width:'+Math.round(v/sm*100)+'%"></i></div>'}).join('')+'</section>'},
more:function(){return '<section class="card"><h2>থিম</h2><button class="bt" style="margin:0" data-a="theme">'+(S.theme==='dark'?'লাইট মোড চালু করো':'ডার্ক মোড চালু করো')+'</button></section>'
 +'<section class="card"><h2>ব্যাকআপ</h2><p class="empty">ডেটা এই ব্রাউজারেই থাকে। ব্যাকআপ কপি করে কোথাও রেখো, দরকারে নিচে পেস্ট করে ইমপোর্ট করো।</p><textarea id="imp" aria-label="ব্যাকআপ ডেটা"></textarea><div class="two"><button class="bt" data-a="copy">ব্যাকআপ কপি</button><button class="bt" data-a="imp">ইমপোর্ট করো</button></div></section>'
 +'<section class="card"><h2>রিসেট</h2><button class="bt r" style="margin:0" data-a="reset">সব ডেটা মুছে ফেলো</button></section>'}};
var PGS={bro:['bro','run','goal','tasks','wall','week','eod','log'],courses:['courses'],plan:['plan'],stats:['stats'],more:['more']};
function R(){for(var i=0;i<arguments.length;i++){var e=$('s-'+arguments[i]);if(e&&B[arguments[i]])e.innerHTML=B[arguments[i]]();}sync();tick()}
function greet(){var h=new Date().getHours();return (h<5?'শুভ রাত্রি':h<12?'শুভ সকাল':h<16?'শুভ দুপুর':h<19?'শুভ বিকেল':'শুভ রাত্রি')+', ইস্তিয়াক ভাই'}
var TT={bro:['',''],courses:['সিলেবাস ট্র্যাক','কোর্স'],plan:['আজ ও কালকের কাজ','প্ল্যান'],stats:['তোমার অগ্রগতি','স্ট্যাটস'],more:['সেটিংস ও ব্যাকআপ','আরও']};
function view(anim){var a=$('app');$('sub').textContent=page==='bro'?greet():TT[page][0];$('ttl').textContent=page==='bro'?'ইস্তিয়াক ব্রো':TT[page][1];
 a.innerHTML=PGS[page].map(function(id){return '<div id="s-'+id+'">'+B[id]()+'</div>'}).join('');
 if(anim){a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}
 UI.last='';sync();tick()}
function sync(){['bgo','rgo'].forEach(function(id){var b=$(id);if(!b)return;b.textContent=S.run?'থামাও ও সেভ করো':'পড়া শুরু করো';b.classList.toggle('stop',!!S.run)})}

/* eyes */
function mood(){var t=today();return S.run?'focus':t<60?'sad':t<3600?'calm':t<S.goal?'happy':'proud'}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function eyes(){var m=mood(),e=$('eyes');if(!e||m===UI.last)return;UI.last=m;var M=MD[m],s=e.children;e.style.color=M.c;
 [M.l,M.q].forEach(function(cp,i){var st=s[i].style;st.width=M.w+'px';st.height=M.h+'px';st.borderRadius=M.r;st.clipPath=cp});
 setT('tag',M.t);if(Date.now()>UI.pu)setT('msg',pick(M.m))}
function poke(){var e=$('eyes');if(!e)return;e.classList.add('pk');setTimeout(function(){e.classList.remove('pk')},160);UI.pu=Date.now()+2800;setT('msg',pick(POKE));buzz(10);setTimeout(function(){if(Date.now()>=UI.pu){UI.last='';eyes()}},2900)}
setInterval(function(){var e=$('eyes');if(!e)return;e.classList.add('bk');setTimeout(function(){e.classList.remove('bk')},140)},3600);

/* timer */
function addSes(t,sec,n){var rem=sec,s=t;while(rem>0){var e=new Date(s);e.setHours(24,0,0,0);var c=Math.min(rem,Math.max(1,Math.round((e-s)/1000))),k=KD(new Date(s));S.log[k]=(S.log[k]||0)+c;s+=c*1000;rem-=c}S.sl[n]=(S.sl[n]||0)+sec}
function lock(on){try{if(on&&navigator.wakeLock&&!UI.wl)navigator.wakeLock.request('screen').then(function(w){UI.wl=w;w.addEventListener('release',function(){UI.wl=null})}).catch(function(){});if(!on&&UI.wl){UI.wl.release();UI.wl=null}}catch(e){}}
function start(){S.run={t:Date.now(),tg:MODES[S.mode][1],s:S.subs[S.cur].n};save();lock(1);buzz(15);R('run');eyes()}
function stop(auto){if(!S.run)return;var r=S.run,el=Math.min(runSec(),36000);if(auto&&r.tg)el=r.tg;S.run=null;if(el>=5)addSes(r.t,el,r.s);save();lock(0);document.title='ইস্তিয়াকের ব্রো';
 R('run','goal','week','log','stats');eyes();setT('clk','--:--');var b=$('bgo');
 if(el>=5){toast((auto?'সেশন শেষ! ':'')+'+'+Math.max(1,Math.round(el/60))+' মিনিট সেভ হয়েছে');burst(b)}}
function toggle(){S.run?stop(0):start()}
function tick(){var d=new Date(),l=Math.max(0,86400-(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())),t=today(),hmv=p2(d.getHours())+':'+p2(d.getMinutes());
 setT('left',Math.floor(l/3600)+':'+p2(Math.floor(l%3600/60)));setT('hrs',hh(t));
 if(S.run){var el=runSec(),tg=S.run.tg;if(tg&&el>=tg){stop(1);beep();return}var tx=tg?fmt(tg-el):fmt(el);setT('clk',tx);setT('sub2',S.run.s+' · '+(tg?'কাউন্টডাউন':'স্টপওয়াচ'));document.title=tx+' · ফোকাস'}
 else{setT('clk',hmv);setT('sub2',d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))}
 var a=hm(t);setH('big',a[0]+'<small>h</small>'+a[1]+'<small>m</small>');setH('lg',hh(t)+'<small>ঘণ্টা</small>');
 var r=$('ring');if(r)r.style.strokeDashoffset=Math.round(264*(1-Math.min(1,t/S.goal)));
 if(t>=S.goal&&S.gd!==K()){S.gd=K();save();toast('আজকের লক্ষ্য পূরণ! দারুণ করেছ ⚡');burst($('ring')||$('hrs'));buzz([60,40,60])}
 if(page==='bro')eyes()}
setInterval(tick,500);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();if(S.run)lock(1)}});

/* actions */
function add(k){var inp=document.querySelector('[data-in="'+k+'"]');if(!inp)return;var v=inp.value.trim();if(!v){inp.focus();return}
 if(k==='w'){S.wall.push(v);R('wall')}else if(k==='ns'){S.subs.push({n:v,t:[]});R('courses')}else if(k[0]==='c'){S.subs[+k.slice(1)].t.push([v,0]);R('courses')}
 else{var d=K(+k.slice(1));(S.tasks[d]=S.tasks[d]||[]).push([v,0]);R('tasks','plan')}
 save();var n=document.querySelector('[data-in="'+k+'"]');if(n)n.focus()}
function prog(i){var s=S.subs[i],dn=s.t.filter(function(t){return t[1]}).length,p=s.t.length?Math.round(dn/s.t.length*100):0,b=$('pb'+i);if(b)b.style.width=p+'%';setT('pt'+i,dn+'/'+s.t.length+' · '+p+'%')}
document.addEventListener('click',function(e){var t=e.target,b=t.closest('button');
 if(!b){if(t.closest('#broc'))poke();return}
 var d=b.dataset;
 if(d.p){location.hash=d.p;if(d.p===page){window.scrollTo({top:0,behavior:'smooth'})}else window.scrollTo(0,0);return}
 if(d.a==='run')toggle();
 else if(d.a==='fs'){var c=$('broc');if(document.fullscreenElement)document.exitFullscreen();else if(c.requestFullscreen)c.requestFullscreen().catch(function(){toast('এখানে ফুল স্ক্রিন চালু হচ্ছে না')});else toast('এই ব্রাউজারে ফুল স্ক্রিন নেই')}
 else if(d.a==='edit'){S.edit=S.edit?0:1;R('wall')}
 else if(d.a==='theme'){S.theme=S.theme==='dark'?'light':'dark';save();setTheme();R('more')}
 else if(d.a==='g-'||d.a==='g+'){S.goal=Math.min(57600,Math.max(1800,S.goal+(d.a==='g+'?1800:-1800)));save();UI.last='';R('goal');eyes()}
 else if(d.a==='carry'){var y=(S.tasks[K(-1)]||[]).filter(function(x){return !x[1]}),L=S.tasks[K()]=S.tasks[K()]||[];y.forEach(function(x){L.push([x[0],0])});S.tasks[K(-1)]=(S.tasks[K(-1)]||[]).filter(function(x){return x[1]});save();R('plan','tasks');toast(y.length+'টি টাস্ক আজকে আনা হলো')}
 else if(d.a==='copy'){var j=JSON.stringify(S),ta=$('imp');ta.value=j;ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}toast(ok?'ব্যাকআপ কপি হয়েছে':'ঘরের লেখা সিলেক্ট হয়েছে, কপি করে নাও')}
 else if(d.a==='imp'){try{var n=JSON.parse($('imp').value);if(!n||!n.subs||!n.log)throw 0;S=n;save();setTheme();toast('ইমপোর্ট হয়েছে');view(1)}catch(x){toast('ডেটা ঠিক নেই, আবার পেস্ট করো')}}
 else if(d.a==='reset'){if(b.dataset.s){S=def();save();setTheme();view(1);toast('সব নতুন করে শুরু')}else{b.dataset.s=1;b.textContent='আবার ট্যাপ করলে সব মুছে যাবে'}}
 else if(d.su){S.cur=+d.su;save();R('run')}
 else if(d.mo){S.mode=+d.mo;save();R('run')}
 else if(d.pd){S.pd=+d.pd;save();R('plan')}
 else if(d.ad)add(d.ad)
 else if(d.dl){var p=pr(d.dl);S.tasks[K(p[0])].splice(p[1],1);save();R('tasks','plan')}
 else if(d.dw){S.wall.splice(+d.dw,1);save();R('wall')}
 else if(d.dt){var q=pr(d.dt);S.subs[q[0]].t.splice(q[1],1);save();R('courses')}});
document.addEventListener('change',function(e){var c=e.target.dataset,on=e.target.checked?1:0,row=e.target.closest('.task');
 if(c.ck){var p=pr(c.ck);S.tasks[K(p[0])][p[1]][1]=on;setT('tc',tcount(p[0]))}
 else if(c.tp){var q=pr(c.tp);S.subs[q[0]].t[q[1]][1]=on;prog(q[0])}
 else if(c.eo!==undefined){var k=K();S.eod[k]=S.eod[k]||[0,0];S.eod[k][+c.eo]=on}else return;
 if(row)row.classList.toggle('d',!!on);if(on){burst(e.target);buzz(12)}save()});
document.addEventListener('keydown',function(e){var el=e.target;
 if(e.key==='Enter'&&el.dataset&&el.dataset.in){add(el.dataset.in);return}
 if(e.code==='Space'&&page==='bro'&&!/INPUT|TEXTAREA|BUTTON/.test(el.tagName)){e.preventDefault();toggle()}});
document.addEventListener('pointermove',function(e){var el=$('eyes');if(!el)return;el.style.transform='translate('+((e.clientX/innerWidth-.5)*16)+'px,'+((e.clientY/innerHeight-.5)*12)+'px)'});
nav();view(1);
})();
</script>
</body>
</html>
